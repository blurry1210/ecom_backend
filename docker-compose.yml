version: '3.8'

services:
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "3006:3000"
    env_file:
      - ./user-service/.env
    networks:
      - app-network

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "3007:3001"
    env_file:
      - ./product-service/.env
    networks:
      - app-network

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "3002:3002"
    env_file:
      - ./order-service/.env
    networks:
      - app-network

  stats-service:
    build: ./stats-service
    container_name: stats-service
    ports:
      - "3005:3003"
    env_file:
      - ./stats-service/.env
    networks:
      - app-network

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "3008:3004"
    env_file:
      - ./payment-service/.env
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
